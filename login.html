<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Job Portal - Login & Register</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', 'Segoe UI', sans-serif; }
        body { background:linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px; }
        .box { background:#ffffff; padding:40px; border-radius:24px; width:100%; max-width:420px; box-shadow:0 25px 50px -12px rgba(0,0,0,0.25); }
        h2 { font-size:24px; font-weight:800; color:#0f172a; text-align:center; margin-bottom:8px; }
        .subtitle { font-size:13px; color:#64748b; text-align:center; margin-bottom:24px; }
        .form-group { margin-bottom:16px; }
        .form-group label { display:block; font-size:12px; font-weight:700; margin-bottom:6px; color:#334155; text-transform:uppercase; letter-spacing:0.5px; }
        .form-group input, .form-group select { width:100%; padding:12px 14px; border:1px solid #cbd5e1; border-radius:10px; font-size:14px; outline:none; transition:all 0.2s; }
        .form-group input:focus, .form-group select:focus { border-color:#4f46e5; box-shadow:0 0 0 3px rgba(79,70,229,0.15); }
        .btn { width:100%; padding:14px; border:none; border-radius:10px; font-weight:700; cursor:pointer; background:#4f46e5; color:white; font-size:15px; transition:all 0.2s; margin-top:8px; box-shadow:0 4px 12px rgba(79,70,229,0.3); }
        .btn:hover { background:#4338ca; transform:translateY(-1px); }
        .toggle-btn { text-align:center; margin-top:18px; font-size:13px; color:#4f46e5; font-weight:600; cursor:pointer; }
        .toggle-btn:hover { text-decoration:underline; }
    </style>
</head>
<body>

    <div class="box">
        <h2 id="formTitle">Welcome Back</h2>
        <p class="subtitle" id="formSub">Sign in to access your dashboard</p>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="loginEmail" placeholder="user@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>
            <div class="form-group">
                <label>Select Your Role</label>
                <select id="loginRole" required>
                    <option value="seeker">Job Seeker (চাকরি প্রার্থী)</option>
                    <option value="employer">Employer (চাকরিদাতা)</option>
                </select>
            </div>
            <button type="submit" class="btn">Login to Account</button>
            <div class="toggle-btn" onclick="toggleForm()">New user? Create an account</div>
        </form>

        <!-- Registration Form -->
        <form id="regForm" onsubmit="handleRegister(event)" style="display:none;">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="regName" placeholder="e.g. Rahim Ahmed" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="regEmail" placeholder="user@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="regPassword" placeholder="••••••••" required>
            </div>
            <div class="form-group">
                <label>Register As</label>
                <select id="regRole" required>
                    <option value="seeker">Job Seeker</option>
                    <option value="employer">Employer</option>
                </select>
            </div>
            <button type="submit" class="btn" style="background:#059669; box-shadow:0 4px 12px rgba(5,150,105,0.3);">Create Account</button>
            <div class="toggle-btn" onclick="toggleForm()">Already have an account? Login</div>
        </form>
    </div>

    <script>
        function toggleForm() {
            const lForm = document.getElementById('loginForm');
            const rForm = document.getElementById('regForm');
            const title = document.getElementById('formTitle');
            const sub = document.getElementById('formSub');

            if (lForm.style.display === 'none') {
                lForm.style.display = 'block';
                rForm.style.display = 'none';
                title.innerText = 'Welcome Back';
                sub.innerText = 'Sign in to access your dashboard';
            } else {
                lForm.style.display = 'none';
                rForm.style.display = 'block';
                title.innerText = 'Create Account';
                sub.innerText = 'Join us today to get started';
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const role = document.getElementById('regRole').value;

            let users = JSON.parse(localStorage.getItem('registeredUsers')) || [];
            if (users.some(u => u.email === email)) {
                alert("এই ইমেইল দিয়ে আগেই অ্যাকাউন্ট খোলা হয়েছে!");
                return;
            }

            users.push({ name, email, password, role });
            localStorage.setItem('registeredUsers', JSON.stringify(users));
            alert("Registration Successful! এখন লগইন করুন।");
            toggleForm();
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const role = document.getElementById('loginRole').value;

            let users = JSON.parse(localStorage.getItem('registeredUsers')) || [];
            const validUser = users.find(u => u.email === email && u.password === password && u.role === role);
            const currentUser = validUser || { name: email.split('@')[0] || "User", email, role };

            localStorage.setItem('loggedInUser', JSON.stringify(currentUser));

            if (role === 'seeker') {
                window.location.href = 'seeker-dashboard.html';
            } else if (role === 'employer') {
                window.location.href = 'employer-dashboard.html';
            }
        }
    </script>
</body>
</html>
